[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "game-avia"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.163.1", "uvicorn==0.54.0", "httpx==0.28.1", "PyYAML==6.0.3", "python-dotenv==1.2.4", "supervisor==4.3.0"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.5.0"]

[tool.setuptools.packages.find]
include = ["orchestrator*", "workers*", "integrations*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
