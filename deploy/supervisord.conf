[unix_http_server]
file=/srv/game-avia/state/runtime/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/srv/game-avia/logs/supervisor.log
logfile_maxbytes=5MB
logfile_backups=3
pidfile=/srv/game-avia/state/runtime/supervisor.pid
childlogdir=/srv/game-avia/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///srv/game-avia/state/runtime/supervisor.sock

[program:coordinator]
directory=/srv/game-avia/repo
command=/srv/game-avia/venvs/core/bin/python -m orchestrator.runtime
autostart=true
autorestart=true
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/srv/game-avia/logs/coordinator.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"

[program:api]
directory=/srv/game-avia/repo
command=/srv/game-avia/venvs/core/bin/python -m uvicorn orchestrator.api:app --host 127.0.0.1 --port 8787 --no-access-log
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/srv/game-avia/logs/api.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true


[program:executor]
directory=/srv/game-avia/repo
command=/srv/game-avia/venvs/core/bin/python -m orchestrator.executor
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/srv/game-avia/logs/executor.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true
