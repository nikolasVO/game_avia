# Render this template with the verified SHA and absolute release path before manual deployment.
[unix_http_server]
file=/srv/game-avia/state/flight/supervisor.sock
chmod=0700
[supervisord]
nodaemon=true
logfile=/srv/game-avia/logs/flight-supervisor.log
logfile_maxbytes=5MB
logfile_backups=3
pidfile=/srv/game-avia/state/flight/supervisor.pid
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///srv/game-avia/state/flight/supervisor.sock
[program:flight]
command=/usr/bin/stdbuf -oL -eL /srv/game-avia/releases/RELEASE_SHA/game-avia-server.x86_64 --headless -- --server --port=24567 --stats=/srv/game-avia/state/flight/progress.json
directory=/srv/game-avia/releases/RELEASE_SHA
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/srv/game-avia/logs/flight.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true
environment=AVIA_DTLS_KEY="/srv/game-avia/state/flight/server.key",GAME_AVIA_RELEASE_SHA="RELEASE_SHA"
